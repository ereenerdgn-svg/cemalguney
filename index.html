var vis = entries.filter(function (en) { return en.isIntersecting; })
.sort(function (a, b) { return a.boundingClientRect.top - b.boundingClientRect.top || a.boundingClientRect.left - b.boundingClientRect.left; });
vis.forEach(function (en, n) {
var e2 = en.target;
e2.style.transitionDelay = Math.min(n, 6) * 90 + 'ms';
e2.classList.add('in-view');
revealIO.unobserve(e2);
setTimeout(function () { e2.style.transitionDelay = ''; e2.classList.remove('reveal'); }, 1800);
});
}, { root: app, threshold: 0.08, rootMargin: '0px 0px -6% 0px' });
var spyIO = new IntersectionObserver(function (entries) {
entries.forEach(function (en) {
if (en.isIntersecting) {
setActive(en.target.id);
if (started) { try { history.replaceState(null, '', '#' + en.target.id); } catch (e) {} }
}
});
}, { root: app, rootMargin: '-45% 0px -50% 0px', threshold: 0 });
Array.prototype.forEach.call(root.querySelectorAll('main > section[id]'), function (s) { spyIO.observe(s); });
}

app.addEventListener('scroll', function () {
nav.classList.toggle('scrolled', app.scrollTop > 40);
var max = app.scrollHeight - app.clientHeight;
progress.style.transform = 'scaleX(' + (max > 0 ? app.scrollTop / max : 0) + ')';
}, { passive: true });

/* Anasayfa sonu → otomatik sonraki bölüm (Hakkımda); yukarı kaydırınca geri döner */
var autoNavLock = false, lastAutoTop = 0;
var homeSec = root.getElementById('home');
app.addEventListener('scroll', function () {
var d = app.scrollTop - lastAutoTop;
lastAutoTop = app.scrollTop;
if (!started || autoNavLock || app.classList.contains('menu-open') || !d) return;
var homeEnd = homeSec.offsetTop + homeSec.offsetHeight;
var viewBottom = app.scrollTop + app.clientHeight;
if (d > 0 && activeId === 'home' && viewBottom >= homeEnd - 40 && app.scrollTop < homeEnd - 80) {
autoNavLock = true;
goTo('about');
setTimeout(function () { autoNavLock = false; }, 1300);
} else if (d < 0 && activeId === 'about' && app.scrollTop < homeEnd - 10 && app.scrollTop > 0) {
autoNavLock = true;
goTo('home');
setTimeout(function () { autoNavLock = false; }, 1300);
}
}, { passive: true });

/* Açılış ekranı: sayaç bitince tıklama beklemeden otomatik geçer.
   İsteyen açılış ekranına dokunarak da hemen geçebilir. */
var introDone = false;
function enter() {
if (introDone) return;
introDone = true;
intro.classList.add('gone');
started = true;
app.classList.add('js-ready');
setMenu(false);
watch();
var h = location.hash.replace('#', '');
if (PAGES.indexOf(h) > 0) setTimeout(function () { goTo(h, true); }, 60);
}
intro.addEventListener('click', function (e) {
if (e.target.closest && e.target.closest('[data-lang]')) return;
enter();
});
var helloEl = root.querySelector('.intro-hello');
var barEl = root.getElementById('intro-bar');
var HELLOS = ['Merhaba', 'Hello', 'Hallo', 'Привет', 'مرحبا', 'Bonjour', 'Hola', 'Ciao', 'こんにちは', '你好', 'Olá'];
function finishCount() {
if (introDone) return;
helloEl.textContent = T('hello');
barEl.style.transform = 'scaleX(1)';
setTimeout(enter, reduce ? 200 : 450);
}
/* Zamanlayıcı tabanlıdır (requestAnimationFrame değil): sayfa arka planda ya da
   gömülü çerçevede olsa bile açılış mutlaka kendiliğinden geçer. */
if (reduce) { finishCount(); }
else {
var c0 = Date.now(), DUR = 2600, STEP = 230, lastIdx = -1;
var introTimer = setInterval(function () {
if (introDone) { clearInterval(introTimer); return; }
var el0 = Date.now() - c0, p = Math.min(1, el0 / DUR), e3 = 1 - Math.pow(1 - p, 3);
barEl.style.transform = 'scaleX(' + e3 + ')';
var idx = Math.floor(el0 / STEP);
if (p < 1 && idx !== lastIdx) { lastIdx = idx; helloEl.textContent = HELLOS[idx % HELLOS.length]; }
if (p >= 1) { clearInterval(introTimer); finishCount(); }
}, 60);
}
setTimeout(function () { if (!introDone) enter(); }, 4200);

var mouseX = -9999, mouseY = -9999;
var finePointer = window.matchMedia && window.matchMedia('(hover: hover) and (pointer: fine)').matches;
if (finePointer) {
var dot = root.getElementById('cursor-dot');
var outline = root.getElementById('cursor-outline');
var ox = 0, oy = 0, cursorRaf = null, firstMove = true;
var cursorLoop = function () {
ox += (mouseX - ox) * 0.15; oy += (mouseY - oy) * 0.15;
outline.style.transform = 'translate3d(' + ox + 'px,' + oy + 'px,0) translate(-50%,-50%)';
if (Math.abs(mouseX - ox) > 0.1 || Math.abs(mouseY - oy) > 0.1) cursorRaf = requestAnimationFrame(cursorLoop); else cursorRaf = null;
};
window.addEventListener('mousemove', function (e) {
mouseX = e.clientX; mouseY = e.clientY;
if (firstMove) { ox = mouseX; oy = mouseY; firstMove = false; app.classList.add('cursor-on'); }
dot.style.transform = 'translate3d(' + mouseX + 'px,' + mouseY + 'px,0) translate(-50%,-50%)';
if (!cursorRaf) cursorRaf = requestAnimationFrame(cursorLoop);
}, { passive: true });
doc.addEventListener('mouseleave', function () { app.classList.remove('cursor-on'); });
doc.addEventListener('mouseenter', function () { if (!firstMove) app.classList.add('cursor-on'); });
app.addEventListener('mouseover', function (e) {
app.classList.toggle('hovering', !!(e.target.closest && e.target.closest('a, button')));
});
}

var canvas = root.getElementById('gears');
if (canvas && canvas.getContext) {
var ctx = canvas.getContext('2d');
var TAU = Math.PI * 2, W = 0, H = 0, M = 8, trains = [], crank = null, rot = 0, vel = 0, raf = null;
var ACC = '76, 180, 255';
var col = function (a) { return 'rgba(' + ACC + ',' + a.toFixed(3) + ')'; };
var DEFS = [
{ x: 0.84, y: 0.26, z: 36, dir: 1, kids: [
{ z: 18, at: 200, kids: [{ z: 27, at: 120 }] },
{ z: 24, at: 95 }
] },
{ x: 0.10, y: 0.86, z: 44, dir: -1, kids: [
{ z: 20, at: -35, kids: [{ z: 30, at: -10, kids: [{ z: 16, at: 40 }] }] }
] }
];
var build = function () {
M = Math.max(4.5, Math.min(10, Math.min(W, H) / 100));
trains = DEFS.map(function (d) {
var g0 = { z: d.z, m: M, r: M * d.z / 2, x: d.x * W, y: d.y * H, parent: null, theta: 0, a: 0 };
var list = [g0];
var walk = function (node, kids) {
(kids || []).forEach(function (k) {
var th = k.at * Math.PI / 180, rc = M * k.z / 2;
var g = { z: k.z, m: M, r: rc, parent: node, theta: th, a: 0, x: node.x + Math.cos(th) * (node.r + rc), y: node.y + Math.sin(th) * (node.r + rc) };
list.push(g); walk(g, k.kids);
});
};
walk(g0, d.kids);
return { dir: d.dir, gears: list };
});
crank = { x: (W < 700 ? 0.38 : 0.60) * W, y: 0.93 * H, r: 5 * M, L: 13 * M, w: 6 * M, h: 5 * M };
};
var solve = function (tr) {
tr.gears[0].a = tr.dir * rot;
for (var i = 1; i < tr.gears.length; i++) {
var g = tr.gears[i], p = g.parent;
g.a = g.theta + Math.PI + Math.PI / g.z - (p.a - g.theta) * p.z / g.z;
}
};
var drawGear = function (g) {
var N = g.z, p = TAU / N, rt = g.r + g.m, rr = g.r - 1.25 * g.m, x = g.x, y = g.y, a = g.a, k, c;
ctx.beginPath();
for (k = 0; k < N; k++) {
c = a + k * p;
var px = x + Math.cos(c - 0.27 * p) * rr, py = y + Math.sin(c - 0.27 * p) * rr;
if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
ctx.lineTo(x + Math.cos(c - 0.12 * p) * rt, y + Math.sin(c - 0.12 * p) * rt);
ctx.lineTo(x + Math.cos(c + 0.12 * p) * rt, y + Math.sin(c + 0.12 * p) * rt);
ctx.lineTo(x + Math.cos(c + 0.27 * p) * rr, y + Math.sin(c + 0.27 * p) * rr);
ctx.arc(x, y, rr, c + 0.27 * p, c + 0.73 * p);
}
ctx.closePath();
ctx.fillStyle = col(0.05); ctx.fill();
ctx.strokeStyle = col(0.7); ctx.lineWidth = 1.7; ctx.lineJoin = 'round'; ctx.stroke();
ctx.lineWidth = 1; ctx.strokeStyle = col(0.32);
ctx.beginPath(); ctx.arc(x, y, rr * 0.80, 0, TAU); ctx.stroke();
if (N >= 20) {
var holes = N >= 36 ? 8 : (N >= 27 ? 6 : 5), hr = rr * 0.5, hs = rr * 0.15;
ctx.strokeStyle = col(0.45);
for (var h = 0; h < holes; h++) {
var ha = a + h * TAU / holes;
ctx.beginPath(); ctx.arc(x + Math.cos(ha) * hr, y + Math.sin(ha) * hr, hs, 0, TAU); ctx.stroke();
}
}
var hub = Math.max(rr * 0.2, 5);
ctx.strokeStyle = col(0.75); ctx.lineWidth = 1.4;
ctx.beginPath(); ctx.arc(x, y, hub, 0, TAU); ctx.stroke();
ctx.beginPath();
ctx.moveTo(x + Math.cos(a) * hub * 0.55, y + Math.sin(a) * hub * 0.55);
ctx.lineTo(x + Math.cos(a) * hub, y + Math.sin(a) * hub);
ctx.stroke();
ctx.fillStyle = col(0.85);
ctx.beginPath(); ctx.arc(x, y, 2, 0, TAU); ctx.fill();
};
var drawAnnotations = function (g) {
var x = g.x, y = g.y, ext = g.r + g.m * 3;
ctx.save();
ctx.lineWidth = 1;
ctx.setLineDash([7, 5]); ctx.strokeStyle = col(0.30);
ctx.beginPath(); ctx.arc(x, y, g.r, 0, TAU); ctx.stroke();
ctx.setLineDash([16, 4, 3, 4]); ctx.strokeStyle = col(0.32);
ctx.beginPath();
ctx.moveTo(x - ext, y); ctx.lineTo(x + ext, y);
ctx.moveTo(x, y - ext); ctx.lineTo(x, y + ext);
ctx.stroke();
ctx.restore();
};
var drawCrank = function () {
if (!crank) return;
var cx = crank.x, cy = crank.y, r = crank.r, L = crank.L, w = crank.w, h = crank.h;
var th = rot;
var pinX = cx + r * Math.cos(th), pinY = cy + r * Math.sin(th);
var xp = pinX + Math.sqrt(L * L - Math.pow(r * Math.sin(th), 2));
var xl = cx + L - r - w * 0.5, xr = cx + L + r + w * 0.65 + 8, gap = 5;
ctx.save();
ctx.lineWidth = 1.3; ctx.strokeStyle = col(0.45);
ctx.beginPath();
ctx.moveTo(xl, cy - h / 2 - gap); ctx.lineTo(xr, cy - h / 2 - gap); ctx.lineTo(xr, cy + h / 2 + gap); ctx.lineTo(xl, cy + h / 2 + gap);
ctx.stroke();
ctx.setLineDash([6, 5]); ctx.strokeStyle = col(0.30); ctx.lineWidth = 1;
ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.stroke();
ctx.setLineDash([]);
ctx.fillStyle = col(0.06); ctx.strokeStyle = col(0.7); ctx.lineWidth = 1.7;
ctx.beginPath(); ctx.rect(xp - w * 0.35, cy - h / 2, w, h); ctx.fill(); ctx.stroke();
var dx = xp - pinX, dy = cy - pinY, len = Math.sqrt(dx * dx + dy * dy), ux = dx / len, uy = dy / len;
var nx = -uy, ny = ux, hw = Math.max(M * 0.8, 4);
ctx.fillStyle = col(0.07); ctx.strokeStyle = col(0.65); ctx.lineWidth = 1.6;
ctx.beginPath();
ctx.moveTo(pinX + nx * hw, pinY + ny * hw); ctx.lineTo(xp + nx * hw * 0.7, cy + ny * hw * 0.7);
ctx.lineTo(xp - nx * hw * 0.7, cy - ny * hw * 0.7); ctx.lineTo(pinX - nx * hw, pinY - ny * hw);
ctx.closePath(); ctx.fill(); ctx.stroke();
ctx.lineWidth = 2.2; ctx.strokeStyle = col(0.8);
ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(pinX, pinY); ctx.stroke();
ctx.lineWidth = 1.5;
ctx.beginPath(); ctx.arc(cx, cy, Math.max(M * 1.3, 8), 0, TAU); ctx.stroke();
ctx.beginPath(); ctx.arc(pinX, pinY, hw * 0.75, 0, TAU); ctx.stroke();
ctx.fillStyle = col(0.85);
ctx.beginPath(); ctx.arc(cx, cy, 2.4, 0, TAU); ctx.fill();
ctx.restore();
};
var draw = function () {
ctx.clearRect(0, 0, W, H);
for (var i = 0; i < trains.length; i++) {
solve(trains[i]);
var j;
for (j = 0; j < trains[i].gears.length; j++) drawAnnotations(trains[i].gears[j]);
for (j = 0; j < trains[i].gears.length; j++) drawGear(trains[i].gears[j]);
}
drawCrank();
};
var kick = function (dy) {
if (reduce) return;
rot += dy * 0.004;
if (!raf) raf = requestAnimationFrame(function () { raf = null; draw(); });
};
app.addEventListener('scroll', function () {
var d = app.scrollTop - lastTop; lastTop = app.scrollTop;
if (d && started) kick(d);
}, { passive: true });
var initCanvas = function () {
var dpr = Math.min(window.devicePixelRatio || 1, 2);
W = window.innerWidth; H = window.innerHeight;
canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
build(); draw();
};
var lastW = window.innerWidth, rt2 = null;
window.addEventListener('resize', function () {
if (window.innerWidth === lastW && Math.abs(window.innerHeight - H) < 140) return;
lastW = window.innerWidth;
clearTimeout(rt2); rt2 = setTimeout(initCanvas, 150);
});
initCanvas();
}
}
if (document.body && document.readyState !== 'loading') { cgInit(); }
else { document.addEventListener('DOMContentLoaded', cgInit); }
})();
</script>
