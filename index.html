var x = g.x + parX, y = g.y + parY, a = g.a, k, c;
ctx.beginPath();
for (k = 0; k < N; k++) {
c = a + k * p;
var px = x + Math.cos(c - 0.27 * p) * rr, py = y + Math.sin(c - 0.27 * p) * rr;
if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
ctx.lineTo(x + Math.cos(c - 0.12 * p) * rt, y + Math.sin(c - 0.12 * p) * rt);
ctx.lineTo(x + Math.cos(c + 0.12 * p) * rt, y + Math.sin(c + 0.12 * p) * rt);
ctx.lineTo(x + Math.cos(c + 0.27 * p) * rr, y + Math.sin(c + 0.27 * p) * rr);
ctx.arc(x, y, rr, c + 0.27 * p, c + 0.73 * p);
}
ctx.closePath();
ctx.fillStyle = col(0.05); ctx.fill();
ctx.strokeStyle = col(0.7); ctx.lineWidth = 1.7; ctx.lineJoin = 'round'; ctx.stroke();
ctx.lineWidth = 1; ctx.strokeStyle = col(0.32);
ctx.beginPath(); ctx.arc(x, y, rr * 0.80, 0, TAU); ctx.stroke();
if (N >= 20) {
var holes = N >= 36 ? 8 : (N >= 27 ? 6 : 5), hr = rr * 0.50, hs = rr * 0.15;
ctx.strokeStyle = col(0.45);
for (var h = 0; h < holes; h++) {
var ha = a + h * TAU / holes;
ctx.beginPath(); ctx.arc(x + Math.cos(ha) * hr, y + Math.sin(ha) * hr, hs, 0, TAU); ctx.stroke();
}
}
var hub = Math.max(rr * 0.2, 5);
ctx.strokeStyle = col(0.75); ctx.lineWidth = 1.4;
ctx.beginPath(); ctx.arc(x, y, hub, 0, TAU); ctx.stroke();
ctx.beginPath();
ctx.moveTo(x + Math.cos(a) * hub * 0.55, y + Math.sin(a) * hub * 0.55);
ctx.lineTo(x + Math.cos(a) * hub, y + Math.sin(a) * hub);
ctx.stroke();
ctx.fillStyle = col(0.85);
ctx.beginPath(); ctx.arc(x, y, 2, 0, TAU); ctx.fill();
}
function drawAnnotations(g) {
var x = g.x + parX, y = g.y + parY, ext = g.r + g.m * 3;
ctx.save();
ctx.lineWidth = 1;
ctx.setLineDash([7, 5]); ctx.strokeStyle = col(0.30);
ctx.beginPath(); ctx.arc(x, y, g.r, 0, TAU); ctx.stroke();
ctx.setLineDash([16, 4, 3, 4]); ctx.strokeStyle = col(0.32);
ctx.beginPath();
ctx.moveTo(x - ext, y); ctx.lineTo(x + ext, y);
ctx.moveTo(x, y - ext); ctx.lineTo(x, y + ext);
ctx.stroke();
ctx.restore();
}
function drawLabel(g, ang) {
var x = g.x + parX, y = g.y + parY, cs = Math.cos(ang), sn = Math.sin(ang);
var r0 = g.r + g.m * 1.2, r1 = r0 + 34;
var sx = x + cs * r0, sy = y + sn * r0, ex = x + cs * r1, ey = y + sn * r1;
var right = cs >= 0, txt = 'm2  Z' + g.z + '  Ø' + (g.z * 2) + ' mm';
ctx.save();
ctx.font = MONO;
var tw = ctx.measureText(txt).width, endX = right ? ex + tw + 10 : ex - tw - 10;
if (endX < 10 || endX > W - 10 || ey < 96 || ey > H - 14) { ctx.restore(); return; }
ctx.strokeStyle = col(0.5); ctx.lineWidth = 1;
ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.lineTo(endX, ey); ctx.stroke();
ctx.fillStyle = col(0.75);
ctx.textAlign = right ? 'left' : 'right';
ctx.fillText(txt, right ? ex + 4 : ex - 4, ey - 5);
ctx.restore();
}
function drawCrank(t) {
if (!crank) return;
var cx = crank.x + parX, cy = crank.y + parY, r = crank.r, L = crank.L, w = crank.w, h = crank.h;
var th = t * 0.9 + scrollY * 0.0032;
var pinX = cx + r * Math.cos(th), pinY = cy + r * Math.sin(th);
var xp = pinX + Math.sqrt(L * L - Math.pow(r * Math.sin(th), 2));
var xl = cx + L - r - w * 0.5, xr = cx + L + r + w * 0.65 + 8, gap = 5;
ctx.save();
ctx.lineWidth = 1.3; ctx.strokeStyle = col(0.45);
ctx.beginPath();
ctx.moveTo(xl, cy - h / 2 - gap); ctx.lineTo(xr, cy - h / 2 - gap); ctx.lineTo(xr, cy + h / 2 + gap); ctx.lineTo(xl, cy + h / 2 + gap);
ctx.stroke();
ctx.strokeStyle = col(0.22);
ctx.beginPath();
ctx.moveTo(xl, cy - h / 2 - gap - 9); ctx.lineTo(xr + 9, cy - h / 2 - gap - 9); ctx.lineTo(xr + 9, cy + h / 2 + gap + 9); ctx.lineTo(xl, cy + h / 2 + gap + 9);
ctx.stroke();
ctx.setLineDash([16, 4, 3, 4]); ctx.strokeStyle = col(0.30); ctx.lineWidth = 1;
ctx.beginPath(); ctx.moveTo(cx - r * 1.6, cy); ctx.lineTo(xr + 36, cy); ctx.stroke();
ctx.beginPath(); ctx.moveTo(cx, cy - r * 1.6); ctx.lineTo(cx, cy + r * 1.6); ctx.stroke();
ctx.setLineDash([6, 5]); ctx.strokeStyle = col(0.30);
ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.stroke();
ctx.setLineDash([]);
ctx.fillStyle = col(0.06); ctx.strokeStyle = col(0.7); ctx.lineWidth = 1.7;
ctx.beginPath(); ctx.rect(xp - w * 0.35, cy - h / 2, w, h); ctx.fill(); ctx.stroke();
ctx.lineWidth = 1; ctx.strokeStyle = col(0.45);
ctx.beginPath();
ctx.moveTo(xp + w * 0.45, cy - h / 2); ctx.lineTo(xp + w * 0.45, cy + h / 2);
ctx.moveTo(xp + w * 0.55, cy - h / 2); ctx.lineTo(xp + w * 0.55, cy + h / 2);
ctx.stroke();
var dx = xp - pinX, dy = cy - pinY, len = Math.sqrt(dx * dx + dy * dy), ux = dx / len, uy = dy / len;
var nx = -uy, ny = ux, hw = Math.max(M * 0.8, 4);
ctx.fillStyle = col(0.07); ctx.strokeStyle = col(0.65); ctx.lineWidth = 1.6;
ctx.beginPath();
ctx.moveTo(pinX + nx * hw, pinY + ny * hw); ctx.lineTo(xp + nx * hw * 0.7, cy + ny * hw * 0.7);
ctx.lineTo(xp - nx * hw * 0.7, cy - ny * hw * 0.7); ctx.lineTo(pinX - nx * hw, pinY - ny * hw);
ctx.closePath(); ctx.fill(); ctx.stroke();
ctx.beginPath(); ctx.arc(xp, cy, hw * 0.45, 0, TAU); ctx.stroke();
ctx.lineWidth = 2.2; ctx.strokeStyle = col(0.8);
ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(pinX, pinY); ctx.stroke();
ctx.lineWidth = 1.5;
ctx.beginPath(); ctx.arc(cx, cy, Math.max(M * 1.3, 8), 0, TAU); ctx.stroke();
ctx.beginPath(); ctx.arc(pinX, pinY, hw * 0.75, 0, TAU); ctx.stroke();
ctx.fillStyle = col(0.85);
ctx.beginPath(); ctx.arc(cx, cy, 2.4, 0, TAU); ctx.fill();
ctx.beginPath(); ctx.arc(pinX, pinY, 2.2, 0, TAU); ctx.fill();
ctx.restore();
}
function drawTitleBlock() {
if (W < 700) return;
var bw = 270, bh = 40, x = W - bw - 20, y = H - bh - 18;
ctx.save();
ctx.strokeStyle = col(0.45); ctx.lineWidth = 1;
ctx.strokeRect(x, y, bw, bh);
ctx.beginPath(); ctx.moveTo(x, y + bh / 2); ctx.lineTo(x + bw, y + bh / 2); ctx.stroke();
ctx.font = MONO; ctx.fillStyle = col(0.7);
ctx.fillText('CEMAL GÜNEY — MAKİNE MÜHENDİSİ', x + 8, y + 14);
ctx.fillStyle = col(0.5);
ctx.fillText('ÖLÇEK 1:1   REV. A   A3', x + 8, y + 33);
ctx.restore();
}
function frame(now) {
var t = (now - t0) / 1000;
var tx = mouseX > -1000 ? (mouseX - W / 2) : 0, ty = mouseY > -1000 ? (mouseY - H / 2) : 0;
parX += (-tx * 0.012 - parX) * 0.06;
parY += (-ty * 0.012 - parY) * 0.06;
ctx.clearRect(0, 0, W, H);
for (var i = 0; i < trains.length; i++) {
var tr = trains[i];
solve(tr, t);
for (var j = 0; j < tr.gears.length; j++) drawAnnotations(tr.gears[j]);
for (j = 0; j < tr.gears.length; j++) {
drawGear(tr.gears[j]);
if (W > 700 && tr.gears[j].lab !== null) drawLabel(tr.gears[j], tr.gears[j].lab);
}
}
drawCrank(t);
drawTitleBlock();
}
function loop(now) { frame(now); raf = requestAnimationFrame(loop); }
function start() { if (!reduce && !raf) raf = requestAnimationFrame(loop); }
function stop() { if (raf) { cancelAnimationFrame(raf); raf = null; } }
function drawOnce() {
if (drawPending) return;
drawPending = true;
requestAnimationFrame(function () { drawPending = false; frame(performance.now()); });
}
function initCanvas() {
var dpr = Math.min(window.devicePixelRatio || 1, 2);
W = window.innerWidth; H = window.innerHeight;
canvas.width = Math.round(W * dpr);
canvas.height = Math.round(H * dpr);
ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
build();
frame(performance.now());
}
app.addEventListener('scroll', function () {
scrollY = app.scrollTop;
if (reduce) drawOnce();
}, { passive: true });
doc.addEventListener('visibilitychange', function () { if (doc.hidden) stop(); else start(); });
var lastW = window.innerWidth;
window.addEventListener('resize', function () {
if (window.innerWidth === lastW && Math.abs(window.innerHeight - H) < 140) return;
lastW = window.innerWidth;
clearTimeout(resizeTimer);
resizeTimer = setTimeout(initCanvas, 150);
});
initCanvas();
start();
}
})();
</script>
